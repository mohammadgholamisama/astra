# sub.vokqem.ir TLS terminator on Iran → reverse tunnel to foreign panel
# Path: client → Iran:443 (stream SNI) → 127.0.0.1:18443 → 127.0.0.1:18081 → foreign:2086
# Fallback: Iran→Iran via secondary edge :18080 (foreign nginx :80). Direct to
# foreign:2086 is often filtered from this edge and must NOT be used alone.
server {
    listen 127.0.0.1:18443 ssl;
    server_name sub.vokqem.ir;

    ssl_certificate     /etc/letsencrypt/live/sub.vokqem.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub.vokqem.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location = /health {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @sub_origin;
    }

    location /sub {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 25s;
        proxy_send_timeout 25s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @sub_origin;
        gzip off;
        proxy_buffering off;
        chunked_transfer_encoding off;
    }

    # Secondary reverse tunnel on other Iran VPS → foreign :80 → uvicorn
    location @sub_origin {
        proxy_pass http://85.9.105.116:18080;
        proxy_http_version 1.1;
        proxy_set_header Host sub.vokqem.ir;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        gzip off;
        proxy_buffering off;
        chunked_transfer_encoding off;
    }

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 25s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @sub_origin;
    }
}
