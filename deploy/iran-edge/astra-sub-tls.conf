# sub.vokqem.ir TLS terminator on Iran → reverse tunnel to foreign panel
# Path: client → Iran:443 (stream SNI) → 127.0.0.1:18443 → 127.0.0.1:18081 → foreign:2086
server {
    listen 127.0.0.1:18443 ssl;
    server_name sub.vokqem.ir;

    ssl_certificate     /etc/letsencrypt/live/sub.vokqem.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub.vokqem.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location = /health {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Tunnel can flap briefly — longer connect avoids false 502/504
        proxy_connect_timeout 15s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location /sub {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        # Keep connect generous; read short enough that app must answer fast
        proxy_connect_timeout 15s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        gzip off;
        proxy_buffering off;
        chunked_transfer_encoding off;
    }

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 15s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
