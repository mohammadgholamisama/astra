# sub.vokqem.ir — reverse tunnel (panel :2086) primary; Cloudflare quick-tunnel fallback
# Path: client → Iran:443 (SNI) → 127.0.0.1:18443 → 127.0.0.1:18081 → panel:2086
# If tunnel is down (502/503/504) → @cf (trycloudflare origin on panel side)
# Update the @cf host whenever cloudflared prints a new trycloudflare URL.
upstream astra_sub_tunnel {
    server 127.0.0.1:18081 max_fails=1 fail_timeout=3s;
    keepalive 16;
}

server {
    listen 127.0.0.1:18443 ssl proxy_protocol;
    server_name sub.vokqem.ir;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    ssl_certificate     /etc/letsencrypt/live/sub.vokqem.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub.vokqem.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location = /health {
        proxy_pass http://astra_sub_tunnel;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @cf;
    }

    location /sub {
        add_header Accept-Ranges "none" always;
        proxy_hide_header Accept-Ranges;
        proxy_pass http://astra_sub_tunnel;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 25s;
        proxy_send_timeout 25s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @cf;
        gzip off;
        proxy_buffering on;
        chunked_transfer_encoding off;
    }

    location / {
        proxy_pass http://astra_sub_tunnel;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @cf;
    }

    # Backup when reverse tunnel is down — keep in sync with live CF quick tunnel URL
    location @cf {
        proxy_pass https://poetry-gasoline-returned-warming.trycloudflare.com;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host poetry-gasoline-returned-warming.trycloudflare.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        gzip off;
        proxy_buffering on;
    }
}
