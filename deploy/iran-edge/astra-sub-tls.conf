# sub.vokqem.ir TLS terminator on Iran → reverse tunnel to foreign panel
# Path: client → Iran:443 (stream SNI) → 127.0.0.1:18443 → 127.0.0.1:18081 → foreign:2086
server {
    listen 127.0.0.1:18443 ssl;
    server_name sub.vokqem.ir;

    ssl_certificate     /etc/letsencrypt/live/sub.vokqem.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub.vokqem.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location = /health {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Tunnel can flap briefly — longer connect avoids false 502/504
        proxy_connect_timeout 15s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location /sub {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_intercept_errors on;
        error_page 502 503 504 = @sub_origin;
        gzip off;
        proxy_buffering off;
        chunked_transfer_encoding off;
    }

    # If reverse SSH (18081) is down, hit origin uvicorn directly so clients
    # never see nginx 502. Does not touch other stream/tunnels.
    location @sub_origin {
        proxy_pass http://45.135.194.205:2086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        gzip off;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 15s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
