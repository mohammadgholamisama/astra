# Astra Iran edge — TCP/SNI relay
# sub.vokqem.ir → local TLS terminator → SSH reverse tunnel → foreign:2086
# out.mavqor.ir → foreign origin (direct)
map $ssl_preread_server_name $astra_edge_443 {
    out.mavqor.ir  45.135.194.205:443;
    sub.vokqem.ir  127.0.0.1:18443;
    default        127.0.0.1:4443;
}

server {
    listen 443 backlog=65535;
    listen [::]:443 backlog=65535;
    ssl_preread on;
    proxy_pass $astra_edge_443;
    proxy_connect_timeout 8s;
    proxy_timeout 86400s;
    proxy_socket_keepalive on;
    proxy_buffer_size 64k;
    proxy_next_upstream off;
}

