# /etc/ssh/sshd_config.d/60-astra-harden.conf
# Prevent SSH lockups under panel load / password storms / leftover sessions.
# Install: cp deploy/sshd-astra-harden.conf /etc/ssh/sshd_config.d/60-astra-harden.conf && systemctl reload ssh

# Cap parallel unauth + per-source storms (bots + retry scripts)
MaxStartups 20:50:40
PerSourceMaxStartups 3
MaxSessions 10
LoginGraceTime 20
ClientAliveInterval 30
ClientAliveCountMax 2
UseDNS no

# Prefer key auth when available (password still works if PermitRootLogin yes)
PubkeyAuthentication yes
PasswordAuthentication yes
