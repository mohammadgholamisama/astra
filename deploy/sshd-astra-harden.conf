# /etc/ssh/sshd_config.d/astra-harden.conf
# Prevent SSH lockups under panel load / leftover sessions.
# Install: cp deploy/sshd-astra-harden.conf /etc/ssh/sshd_config.d/ && systemctl reload ssh

# Allow enough parallel sessions; do not leave auth half-open forever
MaxStartups 50:30:100
MaxSessions 50
LoginGraceTime 30
ClientAliveInterval 30
ClientAliveCountMax 3

# Prefer key auth when available (password still works if PermitRootLogin yes)
PubkeyAuthentication yes
PasswordAuthentication yes
